<app-home></app-home>

<div class="container">
    <div class="formC">
        <h2 class="text-center">Estudio</h2>
        <form [formGroup]="formRegistroEstudio">  
            <input type="hidden" formControlName="id_persona">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12">
                    <div class="mb-3">
                        <label for="estudio" class="form-label">Estudio</label>
                        <input type="text" maxlength="50" class="form-control" id="estudio" formControlName="estudio">
                    </div>
                    <div class="mb-3">
                        <label for="fecha_inicio" class="form-label">Fecha inicio estudio</label>
                        <input type="date" class="form-control" id="fecha_inicio" formControlName="fecha_inicio">
                    </div>
                    <div class="mb-3">
                        <label for="fecha_fin" class="form-label">Fecha fin estudio</label>
                        <input type="date" class="form-control" id="fecha_fin" formControlName="fecha_fin">
                    </div>
                    <div class="mb-3">
                        <label for="descripcion_estudio" class="form-label">Descripcion</label>
                        <textarea maxlength="300" class="form-control" id="descripcion_estudio" formControlName="descripcion_estudio"></textarea>
                    </div>
                </div>
            </div>

            
            <button *ngIf="this.num_estudioId==0; else elseBlock"
            type="submit" class="btn_black" (click)="onSubmitRegistroEstudio()">Guardar</button>

            <ng-template #elseBlock>
                <button type="submit" class="btn_black" (click)="onSubmitActualizarEstudio()">Actualizar</button>
            </ng-template>
    
        </form>
    </div>
</div>

<p-toast></p-toast>
