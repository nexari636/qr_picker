<app-home></app-home>

<a (click)="redireccionar_crear_galeria()" class="top-right-button">Crear nuevo recurso</a>

<div class="container text-center formC">
    <div class="row">
      <div class="col-sm-12 col-md-6 col-lg-4 col-xl-4" *ngFor="let recurso of this.list_recursos_galeria">

        <div class="row recurso_ctn">
            @if(recurso.ruta_recurso.includes(".mp4")){
                <div class="col">
                    <video (click)="this.showDialog(recurso.descripcion_recurso_galeria,false,recurso.ruta_recurso)" class="video_recurso" id="video" width="320" height="240">
                        <source src="{{this.urlBase}}{{recurso.ruta_recurso}}" type="video/mp4">
                    </video>
                </div>
            }@else {
                <div class="col">
                    <div (click)="this.showDialog(recurso.descripcion_recurso_galeria,true,recurso.ruta_recurso)" style="width: 340px; height: 240px; text-align: center; margin-top: 20px;">
                        <img id="imgs" width="320" height="240" src="{{this.urlBase}}{{recurso.ruta_recurso}}">
                    </div>
                </div>
            }
        </div>
        <div class="row recurso_ctn">
            <div class="col">
                <div class="container descripcion" style="margin-bottom: 20px;">
                    Descripción: {{recurso.descripcion_recurso_galeria}}
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>


<div class="flex justify-content-center">
    <p-dialog 
        header="Recurso" 
        [(visible)]="visible" 
        [modal]="true" 
        [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" 
        [style]="{ width: '50vw' }" 
        [draggable]="false" 
        [resizable]="false">
            <div style="margin-top: 10px; margin-bottom: 10px;"><b>Descripcion:</b> {{this.descripcion_modal}}</div>
            <div style="text-align: center; width: 100%; height: 400px;">
                @if(this.tipo_recurso_modal)
                {
                    <img id="imageM"  src="{{this.urlBase}}{{this.url_recurso_modal}}">
                }
                @else{
                    <video style="max-width: 100%; max-height: 100%;" class="video_recursoM" id="videoM" controls>
                        <source src="{{this.urlBase}}{{this.url_recurso_modal}}" type="video/mp4">
                    </video>
                }
            </div>
    </p-dialog>
</div>

<p-toast></p-toast>
