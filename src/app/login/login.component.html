<div class="container">
    <div class="center">
        @if (registro) 
        {
            <h1>Registro</h1>
            <form action="" method="POST" [formGroup]="formRegistro">
                <div class="txt_field">
                    <input type="text" name="text" required formControlName="cedula">
                    <span></span>
                    <label>Cedula</label>
                </div>
                <div class="txt_field">
                    <input type="text" name="text" required formControlName="nombres">
                    <span></span>
                    <label>Nombres</label>
                </div>
                <div class="txt_field">
                    <input type="text" name="text" required formControlName="apellidos">
                    <span></span>
                    <label>Apellidos</label>
                </div>
                <div class="txt_field">
                    <input type="text" name="text" required formControlName="usuario">
                    <span></span>
                    <label>Usuario</label>
                </div>
                <div class="txt_field">
                    <input type="password" name="password" required formControlName="password">
                    <span></span>
                    <label>Contraseña</label>
                </div>
                <input style="margin: 10px;" name="submit" type="Submit" value="Registrarse" (click)="onSubmitRegistro()">
            </form>
        } @else {
            <h1>Login</h1>
            <form  [formGroup]="formLogin">
                <div class="txt_field">
                    <input type="text" name="usuario" required formControlName="usuario">
                    <span></span>
                    <label>Usuario</label>
                </div>
                <div class="txt_field">
                    <input type="password" name="password" required formControlName="password">
                    <span></span>
                    <label>Contraseña</label>
                </div>
                <div class="pass">Cambiar contraseña?</div>
                <input name="submit" type="Submit" value="Login" (click)="onSubmitLogin()">
                <div class="signup_link">
                    No es miembro ? <a (click)="registro=true">Signup</a>
                </div>
            </form>
        }
    </div>
</div>
